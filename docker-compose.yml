services:
  mysql:
    image: mysql:8.0
    container_name: sakila-db-compose
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - sakila-mysql-data:/var/lib/mysql
    networks:
      sakila-net:
        ipv4_address: 172.30.0.20
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  flask-app:
    build: .
    container_name: sakila-app-compose
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DB: ${MYSQL_DATABASE}
    ports:
      - "${FLASK_PORT}:5000"
    networks:
      sakila-net:
        ipv4_address: 172.30.0.21

  adminer:
    image: adminer
    container_name: sakila-adminer
    restart: always
    ports:
      - "8080:8080"
    networks:
      sakila-net:
        ipv4_address: 172.30.0.22

volumes:
  sakila-mysql-data:

networks:
  sakila-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16